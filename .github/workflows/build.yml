name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK release
        run: gradle :app:assembleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk tv-launcher.apk

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher
          path: tv-launcher.apk

      # Cada build vira uma Release. O link fixo
      # https://github.com/<usuario>/<repo>/releases/latest/download/tv-launcher.apk
      # sempre baixa a versão mais nova.
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: tv-launcher.apk
          make_latest: true
